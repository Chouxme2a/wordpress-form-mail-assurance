name: Run WordPress form monitors

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: wfma-monitor
  cancel-in-progress: false

jobs:
  public-site:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger signed monitor batch
        env:
          WFMA_CRON_SECRET: ${{ secrets.WFMA_CRON_SECRET }}
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --max-time 540 \
            -X POST \
            -H "Authorization: Bearer ${WFMA_CRON_SECRET}" \
            https://wp-form-mail-assurance-api.wordpress-form-mail-assurance.workers.dev/api/internal/monitor
