name: Run WordPress form monitors

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: wfma-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger signed monitor batch
        env:
          WFMA_CRON_SECRET: ${{ secrets.WFMA_CRON_SECRET }}
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --max-time 540 \
            -X POST \
            -H "Authorization: Bearer ${WFMA_CRON_SECRET}" \
            https://wp-form-mail-assurance-api.wordpress-form-mail-assurance.workers.dev/api/internal/monitor
